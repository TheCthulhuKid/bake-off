[project]
name = "bake-off"
version = "0.1.0"
description = "Issue triage agent built three ways: LangGraph, PydanticAI and the Anthropic SDK tool runner"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "langgraph>=1.2.18",
    "pyaml>=26.7.0",
    "pydantic>=2.14.1",
    "pydantic-ai>=2.63.0",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
bakeoff = "bakeoff.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakeoff"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bakeoff --cov-report=term-missing --cov-fail-under=80"
